name: Publish @poli/components

on:
  push:
    branches: [master]
    paths:
      - 'packages/components/**'
      - 'packages/tokens/src/**'
  release:
    types: [published]
  workflow_dispatch:

jobs:
  build-and-publish:
    runs-on: ubuntu-latest

    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Setup Node.js
        uses: actions/setup-node@v4
        with:
          node-version: '20'
          registry-url: 'https://npm.pkg.github.com'
          scope: '@poli'
          cache: npm

      - name: Install dependencies
        run: npm install

      - name: Build library
        run: npm run build:lib

      # La ruta debe coincidir con "dest" de packages/components/ng-package.json
      - name: Publish to GitHub Packages
        if: github.event_name == 'release'
        run: |
          cd dist/components
          npm publish
        env:
          NODE_AUTH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
