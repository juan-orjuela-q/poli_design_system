name: Deploy GitHub Pages (Storybook + Docs)

on:
  push:
    branches: [master]
    paths:
      - 'apps/docs/**'
      - 'apps/storybook/**'
      - 'packages/components/src/**'
      - 'packages/tokens/src/**'
      - 'src/stories/**'
  workflow_dispatch:

# Permite desplegar a GitHub Pages
permissions:
  contents: read
  pages: write
  id-token: write

# Solo un deploy a la vez
concurrency:
  group: pages
  cancel-in-progress: false

jobs:
  build:
    runs-on: ubuntu-latest

    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Setup pnpm
        uses: pnpm/action-setup@v4
        with:
          version: 10

      - name: Setup Node.js
        uses: actions/setup-node@v4
        with:
          node-version: '20'
          cache: pnpm

      # Instala el workspace completo (raiz + apps/* + packages/*).
      # No usar npm aqui: mezclar gestores duplica la instalacion de Angular.
      - name: Install dependencies
        run: pnpm install --frozen-lockfile

      - name: Build Storybook
        run: pnpm run build-storybook

      - name: Build Docusaurus
        run: pnpm run build
        working-directory: apps/docs

      - name: Merge artifacts (Storybook at root, Docs at /docs/)
        run: |
          mkdir -p pages
          cp -r apps/storybook/storybook-static/. pages/
          mkdir -p pages/docs
          cp -r apps/docs/build/. pages/docs/

      - name: Upload artifact for Pages
        uses: actions/upload-pages-artifact@v3
        with:
          path: pages

  deploy:
    needs: build
    runs-on: ubuntu-latest
    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}

    steps:
      - name: Deploy to GitHub Pages
        id: deployment
        uses: actions/deploy-pages@v4
