name: Build & Deploy Semilla Front

on:
  push:
    branches: [master]
  pull_request:
    branches: [master]

jobs:
  build:
    runs-on: ubuntu-latest

    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Setup Node.js
        uses: actions/setup-node@v4
        with:
          node-version: '20'
          registry-url: 'https://npm.pkg.github.com'
          scope: '@poli'

      - name: Install dependencies
        run: npm ci
        env:
          # Token con permisos read:packages para descargar @poli/components
          NODE_AUTH_TOKEN: ${{ secrets.POLI_PACKAGES_TOKEN }}

      - name: Build
        run: npm run build:prod

      - name: Upload artifact
        if: github.ref == 'refs/heads/master'
        uses: actions/upload-artifact@v4
        with:
          name: semilla-front-dist
          path: dist/
          retention-days: 7

