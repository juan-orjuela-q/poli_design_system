<main class="login-page" role="main">
  <div class="login-page__card">

    <!-- Logo institucional -->
    <div class="login-page__logo" aria-hidden="true">
      <img
        src="assets/images/logo-poli.svg"
        alt="Politécnico Grancolombiano"
        width="180"
        height="48"
      />
    </div>

    <!-- Encabezado -->
    <header class="login-page__header">
      <h1 class="login-page__title">{{ 'LOGIN.TITLE' | translate }}</h1>
      <p class="login-page__subtitle">{{ 'LOGIN.SUBTITLE' | translate }}</p>
    </header>

    <!-- Botón de acceso con MSAL -->
    <pds-button
      variant="primary"
      size="lg"
      iconStart="login"
      [attr.aria-label]="'Iniciar sesión con cuenta institucional Microsoft'"
      (click)="login()"
    >
      {{ 'LOGIN.BUTTON' | translate }}
    </pds-button>

    <!-- Info de soporte -->
    <footer class="login-page__footer">
      <p>
        {{ 'LOGIN.SUPPORT' | translate }}
        <a
          href="mailto:soporte@poligran.edu.co"
          class="login-page__link"
        >soporte&#64;poligran.edu.co</a>
      </p>
    </footer>

  </div>
</main>
