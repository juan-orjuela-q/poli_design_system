  <section class="showcase-form__section">

    <p class="showcase-form__description">
      Los controles estÃ¡n vinculados con <code>ReactiveFormsModule</code>.

    <form class="showcase-form__reactive" [formGroup]="form" (ngSubmit)="onSubmit()">

      <pds-input-field
        label="Nombre completo"
        placeholder="Tu nombre"
        [required]="true"
        [status]="form.controls.name.invalid && form.controls.name.touched ? 'error' : 'default'"

      <pds-input-field
        label="Correo electrÃ³nico"

        type="email"

        [status]="form.controls.email.invalid && form.controls.email.touched ? 'error' : 'default'"

      <pds-radio-group
        groupLabel="Nivel de experiencia"
        [options]="radioOptions"

      @if (form.valid && form.dirty) {
