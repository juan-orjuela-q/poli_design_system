<div class="login-container">
  <div class="login-content" *ngIf="isAuthenticating">
    <div class="login-loader">
      <app-loader></app-loader>
      <p class="login-message">Iniciando sesión...</p>
    </div>
  </div>

  <div class="login-content" *ngIf="userWithoutSystemAccess">
    <div class="login-error">
      <span class="material-icons login-error-icon">error_outline</span>
      <h2 class="login-error-title">Acceso denegado</h2>
      <p class="login-error-message">No tienes permisos para acceder a este portal. Por favor contacta al administrador del sistema.</p>
    </div>
  </div>

  <!-- Mensaje de timeout o error -->
  <div class="login-content" *ngIf="!isAuthenticating && !userWithoutSystemAccess && errorMessage">
    <div class="login-error">
      <span class="material-icons login-error-icon">schedule</span>
      <h2 class="login-error-title">Problema de conexión</h2>
      <p class="login-error-message">{{ errorMessage }}</p>
      <button class="login-retry-button" (click)="retryLogin()">
        <span class="material-icons">refresh</span>
        Reintentar
      </button>
    </div>
  </div>
</div>
