<div class="error-container">
  <div class="error-icon">
    <pds-icon name="error" size="xl"></pds-icon>
  </div>

  <h1 class="error-title">Error 500</h1>
  <h3 class="error-subtitle">Error interno del servidor</h3>
  <p class="error-description">
    Lo sentimos, ha ocurrido un error inesperado en nuestro servidor.
    Por favor, intenta nuevamente más tarde o contacta a nuestro equipo de soporte si el problema persiste.
  </p>
  <p class="error-thanks">¡Gracias por tu comprensión!</p>

  <div class="error-actions">
    <pds-button variant="primary" size="md" iconEnd="undo" (click)="submit()">
      Regresa a la página anterior
    </pds-button>
    <pds-button variant="outline" size="md" (click)="submit()">
      Volver al inicio
    </pds-button>
  </div>
</div>
