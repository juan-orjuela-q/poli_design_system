<div class="accordion__header" role="button" [attr.aria-expanded]="expanded" (click)="toggle()">
    <span class="accordion__title">{{ title }}</span>
    <span class="accordion__icon" aria-hidden="true">
        <svg xmlns="http://www.w3.org/2000/svg" width="40" height="40" viewBox="0 0 40 40" fill="none">
            <path d="M10 15L20 25L30 15" stroke="#0F385A" stroke-width="2.5" stroke-linecap="round"
                stroke-linejoin="round" />
        </svg>
    </span>
</div>

<div class="accordion__panel" *ngIf="expanded" role="region">
    <ng-content></ng-content>
</div>
