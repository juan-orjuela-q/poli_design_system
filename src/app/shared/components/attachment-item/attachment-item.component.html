<div 
  class="attachment-item" 
  [class.attachment-item--clickable]="mode === 'download'"
  [class.attachment-item--static]="mode === 'delete'"
  (click)="mode === 'download' ? onDownloadClick() : null" 
  [title]="mode === 'download' ? 'Descargar ' + fileName : ''"
>
    <div class="items-left">
        <app-icon class="attachment-item__icon" icon="attach_file"></app-icon>
        <div class="attachment-item__info">
            <span class="attachment-item__name">{{ fileName }}</span>
            <span class="attachment-item__size">{{ fileSizeFormatted }}</span>
        </div>
    </div>
    
    <!-- Botón de descarga (modo download) -->
    <button 
      *ngIf="mode === 'download'" 
      type="button"
      class="circle circle-download"
      (click)="onDownloadClick($event)"
      title="Descargar archivo"
      [attr.aria-label]="'Descargar ' + fileName"
    >
        <app-icon class="attachment-item__download" icon="download"></app-icon>
    </button>

    <!-- Botón de eliminar (modo delete) -->
    <button 
      *ngIf="mode === 'delete'" 
      type="button"
      class="circle circle-delete" 
      (click)="onDeleteClick($event)"
      title="Eliminar archivo"
      [attr.aria-label]="'Eliminar ' + fileName"
    >
        <app-icon class="attachment-item__delete" icon="delete"></app-icon>
    </button>

   
</div>
