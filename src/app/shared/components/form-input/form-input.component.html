<div class="form-input" [ngClass]="[status, labelPosition, disabled ? 'disabled' : '']">
  <!-- Label (optional) -->
  <label *ngIf="label" for="{{ fieldID }}" class="form-input__label">
    <span class="form-input__label-text">{{ label }}</span>

    <!-- Required tag (optional) -->
    <span *ngIf="required" class="form-input__required-tag">*</span>

    <!-- Tooltip helper (optional) -->
    <span *ngIf="tooltip" class="form-input__tooltip" [attr.title]="tooltip">
      <app-icon>help</app-icon>
    </span>
  </label>

  <!-- Input wrapper -->
  <div class="form-input__control">
    <div class="form-input__field-wrapper">
      <input id="{{ fieldID }}" class="form-input__field" [attr.type]="inputType" [attr.placeholder]="placeholder"
        [disabled]="disabled" [value]="value" (input)="onInput($event)" (blur)="onBlur()" />
      
      <!-- Toggle password visibility button -->
      <button 
        *ngIf="type === 'password' && showPasswordToggle"
        type="button" 
        class="form-input__toggle-password" 
        (click)="togglePasswordVisibility()"
        [attr.aria-label]="isPasswordVisible ? 'Ocultar contraseña' : 'Mostrar contraseña'"
        tabindex="-1">
        <app-icon [icon]="isPasswordVisible ? 'visibility_off' : 'visibility'" size="20px"></app-icon>
      </button>
    </div>

    <!-- Helper / validation message -->
    <span *ngIf="message" class="form-input__message poli-utility-info-adicional" [ngClass]="status">
      {{ message }}
    </span>
  </div>
</div>
