<div class="form-textarea" [ngClass]="[status, labelPosition, disabled ? 'disabled' : '']">
  <!-- Label (optional) -->
  <label *ngIf="label" class="form-textarea__label">
    <span class="form-textarea__label-text">{{ label }}</span>

    <!-- Required tag (optional) -->
    <span *ngIf="required" class="form-textarea__required-tag">*</span>

    <!-- Tooltip helper (optional) -->
    <span *ngIf="tooltip" class="form-textarea__tooltip" [attr.title]="tooltip">
      <app-icon icon="help"></app-icon>
    </span>
  </label>

  <!-- Input wrapper -->
  <div class="form-textarea__control">
    <textarea class="form-textarea__field" [attr.rows]="rows" [attr.placeholder]="placeholder"
      [disabled]="disabled" [value]="value" (input)="onValueChange($event)"></textarea>
    <!-- Helper / validation message -->
    <span *ngIf="message" class="form-textarea__message poli-utility-info-adicional" [ngClass]="status">
      {{ message }}
    </span>
  </div>
</div>
