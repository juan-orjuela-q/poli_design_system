<li class="header-nav-item"
    routerLinkActive="active"
    [routerLinkActiveOptions]="{ exact: false }">

  @if (children) {
    <!-- Ítem con hijos -->
    <div class="menu-link has-children" (click)="toggle()">
      <span class="icon">
        <app-icon [icon]="icon"></app-icon>
      </span>
      <span class="texto">{{ texto }}</span>
      <span class="chevron">
        <app-icon [icon]="expanded ? 'expand_less' : 'expand_more'"></app-icon>
      </span>
    </div>
  } @else {
    <!-- Ítem como ruta directa -->
    <a class="menu-link" [routerLink]="ruta">
      <span class="icon">
        <app-icon [icon]="icon"></app-icon>
      </span>
      <span class="texto">{{ texto }}</span>
    </a>
  }

  @if (children && expanded) {
    <ul class="submenu">
      @for (child of children; track child.label) {
        <li routerLinkActive="active" [routerLinkActiveOptions]="{ exact: true }">
          <a [routerLink]="child.route" class="submenu-link">
            {{ child.label }}
          </a>
        </li>
      }
    </ul>
  }
</li>
