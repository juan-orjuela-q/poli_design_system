<div 
  class="loader-container" 
  [class.loader-container--fullscreen]="fullScreen"
  [class.loader-container--small]="size === 'small'"
  [class.loader-container--medium]="size === 'medium'"
  [class.loader-container--large]="size === 'large'"
  [class.loader-container--minimal]="minimal">
  
  <div class="loader-content">
    <div class="spinner"></div>
    <p *ngIf="!minimal" class="loader-message">{{ message }}</p>
  </div>
</div>
