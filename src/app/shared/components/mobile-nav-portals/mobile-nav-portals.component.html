<!-- ╔══════════ BARRA 1: Portal Institucional + Avatar + Toggle ══════════╗ -->
<header class="top-bar">
  <img class="portal-logo" [src]="portalLogoSrc" alt="Portal Institucional" />

  <div class="top-bar-actions">
    <!-- Avatar -->
    <app-avatar
      *ngIf="showUserAvatar"
      class="cursor-pointer"
      (click)="onAvatarClick()"
      [type]="'letter'"
      [size]="'small'"
      [notification]="0"
      [status]="'online'"
      [letter]="userName?.charAt(0) || 'U'"
    ></app-avatar>

    <!-- Botón toggle menú -->
    <button
      *ngIf="showMenu"
      type="button"
      class="menu-toggle"
      [attr.aria-label]="isOpen() ? 'Cerrar menú' : 'Abrir menú'"
      (click)="toggle()"
    >
      <span class="icon" *ngIf="!isOpen()">
        <app-icon icon="dehaze"></app-icon>
      </span>
      <span class="icon close-icon" *ngIf="isOpen()">
        <app-icon icon="close"></app-icon>
      </span>
      <span class="menu-text poli-utility-info-adicional-2">{{ isOpen() ? 'Cerrar' : 'Menú' }}</span>
    </button>
  </div>
</header>

<!-- ╔══════════ BARRA 2: Badge(s) con icono + nombre del aplicativo ══════════╗ -->
<div class="app-bar">
  <!-- Badge padre (portal principal) - opcional y clickeable -->
  <a *ngIf="parentBadgeText" [routerLink]="parentBadgeRoute || '/main'" class="parent-badge-link">
    <app-badge
      [text]="parentBadgeText"
      [type]="'rectangle'"
      [size]="'small'"
      [status]="parentBadgeStatus || 'warning'"
      [iconStart]="parentBadgeIcon || 'badge'"
    ></app-badge>
  </a>

  <!-- Separador -->
  <span *ngIf="parentBadgeText" class="badge-separator">
    <app-icon icon="chevron_right"></app-icon>
  </span>

  <!-- Badge del aplicativo actual (transparente solo si hay parent badge) -->
  <a [routerLink]="appBadgeRoute" class="app-badge-link">
    <app-badge
      [class.app-badge-transparent]="parentBadgeText"
      [text]="appName"
      [type]="'rectangle'"
      [size]="'small'"
      [status]="appBadgeStatus"
      [iconStart]="appIcon || 'badge'"
    ></app-badge>
  </a>
</div>

<!-- ╔══════════ OVERLAY + PANEL ══════════╗ -->
<div class="overlay" *ngIf="showMenu && isOpen()" (click)="close()"></div>

<aside class="side-panel" *ngIf="showMenu">
  <div class="side-panel-inner">
    <!-- Menú principal -->
    <nav class="panel-menu">
      <app-header-nav-item
        *ngFor="let item of menuItems"
        [ruta]="item.route"
        [icon]="item.icon"
        [texto]="item.label"
        size="large"
        [children]="item.children"
      ></app-header-nav-item>
    </nav>

    <!-- Links secundarios -->
    <footer class="panel-footer" *ngIf="footerLinks?.length">
      <a *ngFor="let link of footerLinks" [routerLink]="link.ruta" class="link">
        {{ link.texto }}
      </a>
    </footer>
  </div>
</aside>

<!-- ╔══════════ MODAL DERECHO - INFO DE USUARIO ══════════╗ -->
<app-right-modal
  [closeOnBackdrop]="true"
  [visible]="rightModalOpen()"
  [title]="'Mi cuenta'"
  (close)="closeRightModal()">
  <div class="right-modal-content">
    <!-- Tabs -->
    <app-tabs
      [tabs]="modalTabs"
      [(selectedIndex)]="activeModalTabIndex"
      (selectedIndexChange)="onModalTabChange($event)">
      <!-- Contenido proyectado según tab activo -->
      <div *ngIf="activeModalTabIndex === 0">
        <div class="info-row">
          <app-badge [text]="''" [type]="'rectangle'" [iconStart]="'mail_outline'" [size]="'xl'" [status]="'light'">
          </app-badge>
          <div class="info-body">
            <div class="info-label poli-labels-label-sm">Correo electrónico</div>
            <div class="info-value poli-cuerpo-base-base-regular">{{ email || '--' }}</div>
          </div>
        </div>

        <hr class="modal-divider" />

        <div class="info-row mt-5">
          <app-badge [text]="''" [type]="'rectangle'" [iconStart]="'account_tree'" [size]="'xl'" [status]="'light'">
          </app-badge>
          <div class="info-body">
            <div class="info-label poli-labels-label-sm">Unidad organizacional</div>
            <div class="info-value poli-cuerpo-base-base-regular">{{ organizationalUnit || '--' }}</div>
          </div>
        </div>

        <hr class="modal-divider" />

        <div class="info-row mt-5">
          <app-badge [text]="''" [type]="'rectangle'" [iconStart]="'supervisor_account'" [size]="'xl'" [status]="'light'">
          </app-badge>
          <div class="info-body">
            <div class="info-label poli-labels-label-sm">Rol</div>
            <div class="info-value poli-cuerpo-base-base-regular">{{ role || '--' }}</div>
          </div>
        </div>

        <hr class="modal-divider" />
      </div>
    </app-tabs>

    <div class="modal-footer always-visible">
      <app-button [type]="'destructive'" [size]="'medium'" [iconStart]="'logout'" (click)="signOut()">
        Cerrar sesión
      </app-button>
    </div>
  </div>
</app-right-modal>
