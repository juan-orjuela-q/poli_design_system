<button
  [ngClass]="buttonClasses()"
  [type]="buttonType()"
  [attr.aria-label]="resolvedAriaLabel()"
  (click)="handleClick($event)"
  (keydown)="handleKeydown($event)"
>
  <!-- Overlay de estado pressed (no afecta el layout) -->
  <span class="pds-avatar-button__overlay" aria-hidden="true"></span>

  <!-- Nombre + rol (a la izquierda del avatar, solo si showName) -->
  @if (showName()) {
  <span class="pds-avatar-button__name-block">
    <span class="pds-avatar-button__name">{{ name() }}</span>
    @if (showRole() && role()) {
    <span class="pds-avatar-button__role">{{ role() }}</span>
    }
  </span>
  }

  <!-- Avatar pic + badge (envueltos para que overflow:hidden no corte el badge) -->
  <span class="pds-avatar-button__pic-wrap">
    <span [ngClass]="avatarClasses()">
      @switch (type()) { @case ('image') {
      <img
        class="pds-avatar-button__img"
        [src]="imageSrc()"
        [alt]="name()"
        aria-hidden="true"
      />
      } @case ('icon') {
      <pds-icon
        [name]="iconName()"
        size="md"
        [ariaHidden]="true"
        class="pds-avatar-button__icon"
      />
      } @default {
      <!-- letter -->
      <span class="pds-avatar-button__letter" aria-hidden="true">
        {{ resolvedLetter() }}
      </span>
      } }
    </span>

    <!-- Indicador de notificación (badge) — fuera del __pic para no ser recortado -->
    @if (showBadge()) {
    <span class="pds-avatar-button__badge" aria-hidden="true">
      <svg
        class="pds-avatar-button__badge-icon"
        xmlns="http://www.w3.org/2000/svg"
        viewBox="0 0 20 20"
        fill="none"
        aria-hidden="true"
      >
        <path
          d="M11.0625 16.0625C11.3542 15.7708 11.5 15.4167 11.5 15H8.5C8.5 15.4167 8.64583 15.7708 8.9375 16.0625C9.22917 16.3542 9.58333 16.5 10 16.5C10.4167 16.5 10.7708 16.3542 11.0625 16.0625ZM10 20C8.61667 20 7.31667 19.7375 6.1 19.2125C4.88333 18.6875 3.825 17.975 2.925 17.075C2.025 16.175 1.3125 15.1167 0.7875 13.9C0.2625 12.6833 0 11.3833 0 10C0 8.61667 0.2625 7.31667 0.7875 6.1C1.3125 4.88333 2.025 3.825 2.925 2.925C3.825 2.025 4.88333 1.3125 6.1 0.7875C7.31667 0.2625 8.61667 0 10 0C11.3833 0 12.6833 0.2625 13.9 0.7875C15.1167 1.3125 16.175 2.025 17.075 2.925C17.975 3.825 18.6875 4.88333 19.2125 6.1C19.7375 7.31667 20 8.61667 20 10C20 11.3833 19.7375 12.6833 19.2125 13.9C18.6875 15.1167 17.975 16.175 17.075 17.075C16.175 17.975 15.1167 18.6875 13.9 19.2125C12.6833 19.7375 11.3833 20 10 20ZM6 14H14C14.2833 14 14.5208 13.9042 14.7125 13.7125C14.9042 13.5208 15 13.2833 15 13C15 12.7167 14.9042 12.4792 14.7125 12.2875C14.5208 12.0958 14.2833 12 14 12V9.4C14 8.38333 13.7375 7.45417 13.2125 6.6125C12.6875 5.77083 11.95 5.23333 11 5V4.5C11 4.21667 10.9042 3.97917 10.7125 3.7875C10.5208 3.59583 10.2833 3.5 10 3.5C9.71667 3.5 9.47917 3.59583 9.2875 3.7875C9.09583 3.97917 9 4.21667 9 4.5V5C8.05 5.23333 7.3125 5.77083 6.7875 6.6125C6.2625 7.45417 6 8.38333 6 9.4V12C5.71667 12 5.47917 12.0958 5.2875 12.2875C5.09583 12.4792 5 12.7167 5 13C5 13.2833 5.09583 13.5208 5.2875 13.7125C5.47917 13.9042 5.71667 14 6 14Z"
          fill="var(--surface-status-error-solid, #e0006e)"
        />
      </svg>
    </span>
    }
  </span>

  <!-- Indicador de estado activo (línea azul en hover/pressed) -->
  <span class="pds-avatar-button__indicator" aria-hidden="true"></span>
</button>
