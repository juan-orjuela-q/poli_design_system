<!--
  pds-modal — Design System v2
  ─────────────────────────────────────────────────────────────
  Estructura:
    overlay  >  card (role="dialog")
                  header  [título + botón ✕]
                  body    [ng-content — contenido libre]
                  footer  [ng-content[slot=footer] ó botones built-in]

  ARIA:
  • role="dialog" + aria-modal="true" → anuncia como ventana modal.
  • aria-labelledby → apunta al h2#titleId.
  • El overlay lleva aria-hidden="true" — es decorativo.
  • Focus trap (CDK): el foco no puede salir del modal.
  • Escape → cierra (HostListener en TS).
  ─────────────────────────────────────────────────────────────
-->

@if (open()) {
<!-- Overlay -->
<div class="pds-modal-overlay" aria-hidden="true" (click)="onOverlayClick()">
  <!-- Card del modal -->
  <div
    #modalEl
    [ngClass]="modalClasses()"
    role="dialog"
    aria-modal="true"
    [attr.aria-labelledby]="titleId"
    (click)="$event.stopPropagation()"
  >
    <!-- ── Header: título + botón cerrar ── -->
    <div class="pds-modal__header">
      <h2 [id]="titleId" class="pds-modal__title">{{ title() }}</h2>

      <pds-icon-button
        iconName="close"
        ariaLabel="Cerrar"
        variant="ghost-neutral"
        size="md"
        [rounded]="'rectangle'"
        (click)="closed.emit()"
      />
    </div>

    <!-- ── Body: contenido libre ── -->
    <div class="pds-modal__body">
      <ng-content />
    </div>

    <!-- ── Footer: slot personalizado ó botones built-in ── -->
    <ng-content select="[slot=footer]" />

    @if (showActions()) {
    <div class="pds-modal__footer">
      @if (showCancel()) {
      <pds-button variant="outline" size="md" (click)="closed.emit()">
        {{ cancelLabel() }}
      </pds-button>
      }

      <pds-button variant="primary" size="md" (click)="confirmed.emit()">
        {{ confirmLabel() }}
      </pds-button>
    </div>
    }
  </div>
</div>
}
