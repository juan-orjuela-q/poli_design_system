<div class="simple-stepper">
  <!-- Indicador de paso -->
  <p class="stepper__indicator">{{ stepIndicator }}</p>
  
  <!-- Título y siguiente paso agrupados -->
  <div class="stepper__title-group">
    <!-- Título del paso -->
    <h2 class="stepper__title">{{ stepTitle }}</h2>
    
    <!-- Label del siguiente paso (opcional) -->
    <p class="stepper__next-label" *ngIf="nextStepLabel && !showSuccess">
      <span class="stepper__next-label-text">Siguiente:</span> {{ nextStepLabel }}
    </p>
  </div>
  
  <!-- Barra de progreso -->
  <div class="stepper__progress-bar">
    <div 
      class="stepper__progress-fill" 
      [style.width.%]="progressPercentage">
    </div>
  </div>
  
  <!-- Mensaje de éxito (solo cuando showSuccess = true) -->
  <div class="stepper__success" *ngIf="showSuccess">
    <div class="stepper__success-icon">
      <app-icon icon="check_circle" size="40px"></app-icon>
    </div>
    <p class="stepper__success-message">{{ successMessage }}</p>
    <app-button 
      type="primary" 
      size="medium"
      (onclick)="onSuccessClick()">
      <app-icon icon="arrow_back" size="20px"></app-icon>
      {{ successButtonText }}
    </app-button>
  </div>
</div>
