<div class="timeline-history-container">
  
  <!-- Header opcional con título y exportación -->
  <div *ngIf="finalConfig.showHeader" class="timeline-header">
    <h6 *ngIf="finalConfig.title" class="timeline-title">{{ finalConfig.title }}</h6>
    
    <app-material-select 
      *ngIf="finalConfig.allowExport && exportOptions.length > 0"
      class="export-select" 
      [options]="exportOptions" 
      placeholder="Exportar"
      (selectionChange)="onExportSelected($event)">
    </app-material-select>
  </div>

  <!-- Timeline principal -->
  <div class="timeline-container" [ngStyle]="timelineStyle">
    <div class="timeline-wrapper">
      
      <!-- Items del timeline -->
      <div 
        class="timeline-item" 
        *ngFor="let item of sortedItems; trackBy: trackByDate">
        
        <!-- Icono del timeline -->
        <div 
          class="timeline-icon" 
          [class.active]="item.esActivo" 
          [class.inactive]="!item.esActivo">
        </div>
        
        <!-- Contenido del timeline -->
        <div class="timeline-content">
          
          <!-- Badges de estados -->
          <div class="timeline-badges" *ngIf="item.estados && item.estados.length > 0">
            <app-badge 
              *ngFor="let estado of item.estados" 
              [text]="estado"
              [status]="getStatusBadgeColor(estado)" 
              [type]="'rectangle'" 
              size="small">
            </app-badge>
          </div>
          
          <!-- Detalles del evento -->
          <div class="timeline-details">
            
            <!-- Fecha (siempre se muestra) -->
            <div class="timeline-field">
              <span class="timeline-field-label-date">Fecha</span>
              <span class="timeline-field-value">{{ formatDate(item.fecha) }}</span>
            </div>
            
            <!-- Revisor (opcional) -->
            <div class="timeline-field" *ngIf="shouldShowField(item.revisor)">
              <span class="timeline-field-label">Revisor</span>
              <span class="timeline-field-value">{{ item.revisor }}</span>
            </div>
            
            <!-- Responsable (opcional) -->
            <div class="timeline-field" *ngIf="shouldShowField(item.responsable)">
              <span class="timeline-field-label">Responsable</span>
              <span class="timeline-field-value">{{ item.responsable }}</span>
            </div>
            
            <!-- Observaciones (opcional) -->
            <div class="timeline-field" *ngIf="shouldShowField(item.observaciones)">
              <span class="timeline-field-label">Observaciones</span>
              <span class="timeline-field-value">{{ item.observaciones }}</span>
            </div>
            
          </div>
        </div>
      </div>
      
      <!-- Mensaje cuando no hay items -->
      <div class="timeline-empty" *ngIf="items.length === 0">
        <span class="empty-message">No hay eventos en el historial</span>
      </div>
      
    </div>
  </div>
  
</div>
